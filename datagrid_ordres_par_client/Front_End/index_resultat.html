<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Listing résultats</title>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.1.5/css/dx.light.css">
    <link rel="stylesheet" href="style_resultat.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/23.1.5/js/dx.all.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="script_resultat.js"></script>
</head>
<body class="dx-viewport">
    <main class="container">
        <section class="filter-section">
            <div class="filter-card">
                <h1 class="filter-title">Listing Résultats</h1>
                <div class="filter-row">
                    <div class="filter-group">
                        <div id="dateDebut"></div>
                    </div>
                    <div class="filter-group">
                        <div id="dateFin"></div>
                    </div>
                </div>
                <div class="text-center">
                    <div id="btnFiltrer"></div>
                    <input type="file" id="importFile" accept=".csv, .xlsx, .xls" style="display:none;">
                    <div id="btnImport"></div>
                </div>
            </div>
        </section>
        <section id="grid-section">
            <div id="gridContainer"></div>
            <div id="btnCreateFilter"></div>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2025 Laboratoire </p>
    </footer>
</body>
</html>
